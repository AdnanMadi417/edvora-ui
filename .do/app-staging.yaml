# IMPORTANT — READ BEFORE RUNNING doctl apps update --spec
# Running this command against a live app WILL wipe any secret whose stored value
# is not included here as a literal `value:` field. All secrets are managed via
# the DO dashboard (App-Level Environment Variables). To safely update this spec:
#   1. doctl apps spec get $FE_STAGING_APP_ID > /tmp/live.yaml  (backup live state)
#   2. Make your changes to /tmp/live.yaml directly
#   3. doctl apps update $FE_STAGING_APP_ID --spec /tmp/live.yaml
#   4. Immediately verify secrets are still set in DO dashboard
# Do NOT add literal secret values to this file — it is committed to version control.

# The live app is named `squid-app`; the name here must match or a spec push
# would not target it.
name: squid-app
region: sgp1

# Buildpack stack, as set on the live app.
features:
  - buildpack-stack=ubuntu-22

# App-level alert policies. Email-only by default; Slack routing is configured
# through DigitalOcean's Slack integration, not the CI webhook.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# Cloudflare-proxied hostname. Add the DNS record DNS-only (grey) first so
# DigitalOcean can validate and issue the certificate, then switch it to Proxied.
domains:
  - domain: app-staging.unibexs.com
    type: PRIMARY

envs:
  - key: SIGNOZ_INGESTION_KEY
    scope: RUN_TIME
    type: SECRET

  - key: SIGNOZ_ENDPOINT
    scope: RUN_TIME
    type: SECRET

  - key: AUTH_SECRET_KEY
    scope: RUN_TIME
    type: SECRET

services:
  - name: unibexs-frontend
    image:
      deploy_on_push:
        enabled: false
      registry_type: DOCR
      registry: unibexs-internal
      repository: unibexs-frontend-staging
      tag: staging-latest
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    http_port: 3000
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      failure_threshold: 3
    envs:
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: "staging"
      - key: SIGNOZ_SERVICE_NAME
        scope: RUN_TIME
        value: "unibexs-ui"
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      
